    <main>
        <section class="section resume-page">
            <h2 class="section-title">My Resume</h2>

            <!-- Drawing Controls -->
            <div class="drawing-controls" style="flex-wrap: wrap; gap: 1rem;">
                <div class="control-group">
                    <a href="assets/docs/resume.pdf" download class="btn primary"><i class="fa-solid fa-download"></i> Download PDF</a>
                    <button id="toggle-pen" class="btn secondary"><i class="fa-solid fa-pen"></i> Pen</button>
                    <button id="toggle-highlighter" class="btn secondary"><i class="fa-solid fa-highlighter"></i>
                        Highlighter</button>
                </div>

                <div class="control-group properties">
                    <div class="color-picker-wrapper">
                        <input type="color" id="color-picker" value="#ff0000" title="Choose Color">
                    </div>
                    <div class="range-wrapper">
                        <i class="fa-solid fa-circle-dot" style="font-size: 0.8rem;"></i>
                        <input type="range" id="line-width" min="1" max="20" value="5" title="Adjust Thickness">
                        <i class="fa-solid fa-circle" style="font-size: 1.2rem;"></i>
                    </div>
                </div>

                <button id="clear-drawing" class="btn secondary"><i class="fa-solid fa-eraser"></i> Clear</button>
            </div>

            <div id="resume-skeleton" class="resume-skeleton">
                <div class="skeleton-shimmer"></div>
            </div>
            <div id="ambient-container">
                <!-- Canvas elements will be injected here by resume.js -->
            </div>
        </section>
