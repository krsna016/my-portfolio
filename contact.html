<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Anurag Pareek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="logo">AP.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#experience">Experience</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>

    <section class="section contact-page">
        <div class="container">
            <h2 class="section-title">Get in Touch</h2>
            <div class="contact-container glass fade-in-up">
                <p class="contact-intro">Have a project in mind or just want to say hi? Fill out the form below and I'll
                    get back to you as soon as possible.</p>

                <!-- Formspree form - User needs to update the action URL with their own Formspree ID -->
                <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Your Email">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
                    </div>
                    <button type="submit" class="btn primary submit-btn">Send Message <i
                            class="fa-solid fa-paper-plane"></i></button>
                </form>

                <div class="direct-contact">
                    <p>Or reach me directly at:</p>
                    <div class="contact-links">
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=anurag020416@gmail.com" target="_blank"
                            class="contact-btn"><i class="fa-solid fa-envelope"></i> Email</a>
                        <a href="https://www.linkedin.com/in/anuragpareek016" target="_blank" class="contact-btn"><i
                                class="fa-brands fa-linkedin"></i> LinkedIn</a>
                        <a href="https://github.com/krsna016" target="_blank" class="contact-btn"><i
                                class="fa-brands fa-github"></i> GitHub</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Anurag Pareek. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
