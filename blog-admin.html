    <style>
        .category-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
        }

        /* Categories styling */
        .category-list li {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px 24px;
            border-radius: 30px; /* Pill shape */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .category-list li:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateY(-2px);
        }
        
        .category-list li.active {
            background: rgba(108, 92, 231, 0.15);
            color: var(--primary-color);
            border: 1px solid rgba(108, 92, 231, 0.3);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.1);
        }

        /* Admin Controls */
        #admin-controls {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
        }

        /* Post Reader styling */
        #post-reader {
            display: none;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        
        #back-button {
            margin-bottom: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #back-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Aesthetic Markdown Body */
        .markdown-body {
            color: #dcdde1;
            line-height: 1.8;
            font-size: calc(1.15rem * var(--blog-scale, 1));
            font-weight: 300;
            transition: font-size 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin-top: 2.5em;
            margin-bottom: 1em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .markdown-body h1 { 
            font-size: calc(2.8rem * var(--blog-scale, 1)); 
            background: linear-gradient(135deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            line-height: 1.2;
            transition: font-size 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .markdown-body h2 { 
            font-size: calc(2.2rem * var(--blog-scale, 1)); 
            color: #fff;
            border-bottom: 2px solid rgba(108, 92, 231, 0.2); 
            padding-bottom: 10px;
            transition: font-size 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .markdown-body h3 {
            font-size: calc(1.6rem * var(--blog-scale, 1));
            color: var(--primary-color);
            transition: font-size 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .markdown-body p {
            margin-bottom: 1.8em;
            letter-spacing: 0.2px;
        }

        /* Mac-like Code Blocks */
        .markdown-body pre {
            background: #1e1e24;
            padding: 40px 20px 20px 20px; /* space for mac buttons */
            border-radius: 12px;
            overflow-x: auto;
            margin-bottom: 2em;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* Mac window dots */
        .markdown-body pre::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
            box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f;
        }
        
        .markdown-body code {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            background: rgba(108, 92, 231, 0.15);
            color: #a29bfe;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        .markdown-body pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-weight: 400;
            font-size: 0.95em;
            line-height: 1.5;
        }

        /* Beautiful Blockquotes */
        .markdown-body blockquote {
            position: relative;
            background: linear-gradient(to right, rgba(108, 92, 231, 0.1), transparent);
            border-left: 4px solid var(--primary-color);
            padding: 20px 20px 20px 45px;
            margin: 2em 0;
            border-radius: 0 12px 12px 0;
            color: #b2bec3;
            font-style: italic;
            font-size: 1.2rem;
        }

        .markdown-body blockquote::before {
            content: '"';
            position: absolute;
            left: 10px;
            top: 5px;
            font-size: 4rem;
            color: rgba(108, 92, 231, 0.2);
            font-family: serif;
            line-height: 1;
        }
        
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 2em;
            padding-left: 25px;
        }
        
        .markdown-body li {
            margin-bottom: 0.8em;
            position: relative;
        }

        /* Custom Bullet Points */
        .markdown-body ul li::marker {
            color: var(--primary-color);
        }
        
        /* Modal inputs */
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color) !important;
        }
