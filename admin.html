<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Anurag Pareek</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="assets/css/core/style.css?v=1367">
    <!-- Feature-specific Styles -->
    <link rel="stylesheet" href="assets/css/features/cyberpunk_grid.css?v=1367">
    <link rel="stylesheet" href="assets/css/features/intense_pack.css?v=1367">
    <!-- Design System Overrides -->
    <link rel="stylesheet" href="assets/css/core/cyber_theme.css?v=1367">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #080710;
            overflow: hidden;
            margin: 0;
        }
        #login-overlay {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="background-glow"></div>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box glass" id="auth-box">
            <h2 style="margin-bottom: 1rem;">Admin Access</h2>
            <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 1.5rem;">Hardware Authentication Required</p>
            
            <button type="button" class="btn primary" id="biometric-btn" style="width: 100%; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; padding: 1rem 0.5rem; white-space: normal;">
                <i class="fa-solid fa-fingerprint" style="font-size: 1.2rem;"></i> Biometric Login
            </button>

            <div style="margin: 1.5rem 0; color: #555; display: flex; align-items: center;">
                <hr style="flex:1; border-color: #333;"><span style="padding: 0 10px; font-size: 0.8rem;">OR</span><hr style="flex:1; border-color: #333;">
            </div>

            <form id="login-form">
                <input type="password" id="admin-password" placeholder="Fallback Password" required>
                <button type="submit" class="btn secondary" style="width: 100%;">Login</button>
            </form>
            <p id="login-error" style="color: #ff6b6b; font-size: 0.8rem; margin-top: 10px; display: none;">Incorrect password</p>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="assets/js/core/script.js"></script>
    <script src="assets/js/pages/admin.js"></script>
    <script src="assets/js/ui/reactive_grid.js?v=1367" defer></script>
    <script src="assets/js/ui/cyber_ui.js"></script>
    <script src="assets/js/ui/radar_cursor.js?v=1367" defer></script>
</body>

</html>
