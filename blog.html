<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anurag Pareek | Blog</title>
    <meta name="description" content="Blog of Anurag Pareek">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify for sanitizing HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .blog-container {
            max-width: 1200px;
            margin: 120px auto 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 40px;
        }

        .blog-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-list li {
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-list li:hover, .category-list li.active {
            background: var(--primary-color);
            color: var(--background-color);
            font-weight: 600;
        }

        .blog-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Blog Main Cards */
        .post-card {
            padding: 25px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .post-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.2);
        }

        .post-meta {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .post-category {
            color: #fff;
            background: linear-gradient(135deg, var(--primary-color), #a29bfe);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        /* Admin Controls */
        #admin-controls {
            background: linear-gradient(145deg, rgba(108, 92, 231, 0.1), rgba(0, 0, 0, 0.2));
            border: 1px solid rgba(108, 92, 231, 0.3) !important;
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.1);
            backdrop-filter: blur(8px);
        }

        /* Post Reader styling */
        #post-reader {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }
        
        #back-button {
            margin-bottom: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #a29bfe;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s;
            padding: 8px 16px;
            background: rgba(108, 92, 231, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        
        #back-button:hover {
            background: rgba(108, 92, 231, 0.2);
            transform: translateX(-5px);
        }

        /* Aesthetic Markdown Body */
        .markdown-body {
            color: #dcdde1;
            line-height: 1.8;
            font-size: 1.15rem;
            font-weight: 300;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin-top: 2.5em;
            margin-bottom: 1em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .markdown-body h1 { 
            font-size: 2.8rem; 
            background: linear-gradient(135deg, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            line-height: 1.2;
        }

        .markdown-body h2 { 
            font-size: 2.2rem; 
            color: #fff;
            border-bottom: 2px solid rgba(108, 92, 231, 0.2); 
            padding-bottom: 10px;
        }

        .markdown-body h3 {
            font-size: 1.6rem;
            color: var(--primary-color);
        }
        
        .markdown-body p {
            margin-bottom: 1.8em;
            letter-spacing: 0.2px;
        }

        /* Mac-like Code Blocks */
        .markdown-body pre {
            background: #1e1e24;
            padding: 40px 20px 20px 20px; /* space for mac buttons */
            border-radius: 12px;
            overflow-x: auto;
            margin-bottom: 2em;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* Mac window dots */
        .markdown-body pre::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
            box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f;
        }
        
        .markdown-body code {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            background: rgba(108, 92, 231, 0.15);
            color: #a29bfe;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        .markdown-body pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-weight: 400;
            font-size: 0.95em;
            line-height: 1.5;
        }

        /* Beautiful Blockquotes */
        .markdown-body blockquote {
            position: relative;
            background: linear-gradient(to right, rgba(108, 92, 231, 0.1), transparent);
            border-left: 4px solid var(--primary-color);
            padding: 20px 20px 20px 45px;
            margin: 2em 0;
            border-radius: 0 12px 12px 0;
            color: #b2bec3;
            font-style: italic;
            font-size: 1.2rem;
        }

        .markdown-body blockquote::before {
            content: '"';
            position: absolute;
            left: 10px;
            top: 5px;
            font-size: 4rem;
            color: rgba(108, 92, 231, 0.2);
            font-family: serif;
            line-height: 1;
        }
        
        .markdown-body ul, .markdown-body ol {
            margin-bottom: 2em;
            padding-left: 25px;
        }
        
        .markdown-body li {
            margin-bottom: 0.8em;
            position: relative;
        }

        /* Custom Bullet Points */
        .markdown-body ul li::marker {
            color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .blog-container {
                grid-template-columns: 1fr;
            }
            .blog-sidebar {
                position: relative;
                top: 0;
            }
            #post-reader {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="background-glow"></div>

    <nav class="navbar">
        <div class="logo-container">
            <a class='logo' href='index.html'>AP.</a>
        </div>
        <ul class="nav-links">
            <li><a href="/#home">Home</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#experience">Experience</a></li>
            <li><a href="/#projects">Projects</a></li>
            <li><a href="/#skills">Skills</a></li>
            <li><a href="blog.html" class="active">Blog</a></li>
        </ul>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>

    <div class="blog-container">
        <!-- Admin Login Control -->
        <div style="grid-column: 1 / -1; margin-bottom: 20px; display: flex; justify-content: flex-end;">
            <button id="show-login-btn" class="btn secondary" style="font-size: 0.8rem; padding: 5px 10px;"><i class="fa-solid fa-lock"></i> Admin Login</button>
            <button id="logout-btn" class="btn secondary" style="display: none; font-size: 0.8rem; padding: 5px 10px; background: #e74c3c; color: white;"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- Admin Controls (Hidden by default, shown after login) -->
        <div id="admin-controls" style="display: none; grid-column: 1 / -1; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed var(--primary-color);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: var(--primary-color);"><i class="fa-solid fa-unlock"></i> Live Admin Panel</h3>
                <button id="new-post-btn" class="btn primary" style="padding: 8px 15px; font-size: 0.9rem;">+ New Post</button>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="blog-sidebar">
            <h3 style="margin-bottom: 20px; font-size: 1.5rem;">Categories</h3>
            <ul class="category-list" id="category-list">
                <li class="active" data-category="All">All Posts</li>
                <!-- Categories injected by JS -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="blog-main">
            <!-- List View -->
            <div id="posts-list">
                <!-- Posts injected by JS -->
            </div>

            <!-- Reader View -->
            <div id="post-reader">
                <div id="back-button"><i class="fa-solid fa-arrow-left"></i> Back to Posts</div>
                <div id="reader-content" class="markdown-body"></div>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: var(--background-color); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1);">
            <h2 style="margin-bottom: 20px; color: var(--primary-color);">Admin Login</h2>
            <form id="login-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="password" id="login-password" placeholder="Admin Password" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" id="close-login-btn" class="btn secondary">Cancel</button>
                    <button type="button" id="submit-login-btn" class="btn primary">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Editor Modal -->
    <div id="admin-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: var(--background-color); padding: 30px; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);">
            <h2 id="modal-title" style="margin-bottom: 20px; color: var(--primary-color);">New Post</h2>
            <form id="admin-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="admin-id" placeholder="Slug / ID (e.g. my-new-post)" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <input type="text" id="admin-title" placeholder="Post Title" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <input type="text" id="admin-category" placeholder="Category (e.g. DSA)" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <textarea id="admin-summary" placeholder="Short Summary" rows="3" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); font-family: inherit;"></textarea>
                <textarea id="admin-content" placeholder="Markdown Content..." rows="15" style="padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); font-family: 'Fira Code', monospace;"></textarea>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" id="close-modal" class="btn secondary">Cancel</button>
                    <button type="button" id="save-post-btn" class="btn primary">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-socials">
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=anurag020416@gmail.com" target="_blank"
                aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
            <a href="https://www.linkedin.com/in/anuragpareek016" target="_blank" aria-label="LinkedIn"><i
                    class="fa-brands fa-linkedin"></i></a>
            <a href="https://github.com/krsna016" target="_blank" aria-label="GitHub"><i
                    class="fa-brands fa-github"></i></a>
        </div>
        <p>&copy; 2025 Anurag Pareek. All rights reserved.</p>
    </footer>

    <!-- Script to Handle Blog Logic -->
    <script src="assets/js/blog_data.js"></script>
    <script src="assets/js/blog_logic.js"></script>
</body>

</html>
