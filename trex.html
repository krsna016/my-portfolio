    <style>
        /* Inline styles for game specific elements */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding-top: 80px;
        }

        #game-board {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
            margin-bottom: 1rem;
            /* Ensure crisp pixel art if we used images, but we're using shapes */
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--secondary-color);
            font-weight: 600;
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .game-instructions {
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            max-width: 400px;
        }

        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-over-modal.visible {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 30px rgba(108, 99, 255, 0.4);
        }

        .modal-content h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .final-score {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            display: block;
        }
    </style>
