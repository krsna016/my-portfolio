    <style>
        /* Inline styles for game specific elements to keep style.css clean */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding-top: 80px;
        }

        #game-board {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
            margin-bottom: 1rem;
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--secondary-color);
            font-weight: 600;
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .game-instructions {
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            max-width: 400px;
        }

        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-over-modal.visible {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
            border: none;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .final-score {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            display: block;
        }
    </style>
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div class="background-glow"></div>


    <canvas id="particle-canvas"></canvas>

    <nav class="navbar">
        <a href="index.html" class="logo">AP.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Arcade</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>

    <div class="game-container">
        <div class="score-board">Score: <span id="score">0</span></div>

        <canvas id="game-board" width="600" height="600"></canvas>

        <div class="game-controls">
            <button id="start-btn" class="btn primary">Start Game</button>
            <button id="pause-btn" class="btn secondary" style="display: none;">Pause</button>
        </div>

        <p class="game-instructions">Use <strong>Arrow Keys</strong> to move. Press <strong>Spacebar</strong> to pause.
            Eat the red food to grow. Don't hit the
            walls or yourself!</p>
    </div>

    <div id="game-over-modal" class="game-over-modal">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <span class="final-score">Your Score: <span id="final-score">0</span></span>
            <button id="restart-btn" class="btn primary">Play Again</button>
            <br><br>
            <a href="games.html" class="btn secondary">Back to Arcade</a>
        </div>
    </div>

</body>
