    <style>
        /* Inline styles for game specific elements to keep style.css clean */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding-top: 80px;
        }

        #game-board {
            background: #050505;
            border: 2px solid #00d2ff;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            margin-bottom: 1rem;
            position: relative;
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #00FF41; /* Matrix green */
            font-weight: 600;
            font-family: var(--font-primary, monospace);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .game-controls .btn {
            background: transparent;
            color: #00FF41;
            border: 1px solid #00FF41;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: var(--font-primary, monospace);
            letter-spacing: 1px;
            box-shadow: none;
        }

        .game-controls .btn:hover {
            background: #00FF41;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .game-instructions {
            color: #00d2ff;
            font-family: var(--font-primary, monospace);
            font-size: 0.9rem;
            text-align: center;
            max-width: 400px;
            opacity: 0.8;
        }

        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-over-modal.visible {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #0a0a0a;
            border: 1px solid #ff003c;
            padding: 3rem;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.2);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #ff003c;
            margin-bottom: 1rem;
            font-size: 2rem;
            font-family: var(--font-primary, monospace);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .final-score {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            display: block;
            color: #00d2ff;
            font-family: var(--font-primary, monospace);
        }

        .modal-content .btn {
            background: transparent;
            color: #00FF41;
            border: 1px solid #00FF41;
            border-radius: 4px;
            text-transform: uppercase;
            font-family: var(--font-primary, monospace);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            box-shadow: none;
            width: 100%;
        }

        .modal-content .btn:hover {
            background: #00FF41;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .modal-content .btn.secondary {
            color: #00d2ff;
            border-color: #00d2ff;
        }

        .modal-content .btn.secondary:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
